name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ctx-core
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-X main.version=${version}" \
                -o "dist/ctx-core_${os}_${arch}" ./cmd/ctx-core
            done
          done
          (cd dist && sha256sum ctx-core_* > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ctx-core_darwin_amd64
            dist/ctx-core_darwin_arm64
            dist/ctx-core_linux_amd64
            dist/ctx-core_linux_arm64
            dist/checksums.txt
